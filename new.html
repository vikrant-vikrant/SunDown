<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <style>
      body {
        font-family: "Poppins", sans-serif;
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #1c1d22;
      }
      button {
        padding: 10px;
      }
      .notifications {
        position: fixed;
        top: 30px;
        right: 20px;
      }
      .toast {
        position: relative;
        padding: 10px;
        color: #fff;
        margin-bottom: 10px;
        width: 300px;
        display: grid;
        grid-template-columns: 40px 1fr 25px;
        border-radius: 5px;
        --color: #0abf30;
        background-image: linear-gradient(to right, #0abf3055, #22242f 100%);
        animation: show 0.3s ease 1 forwards;
      }
      .toast i {
        color: var(--color);
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: x-large;
      }
      .toast .title {
        font-size: x-large;
        font-weight: bold;
      }
      .toast span,
      .toast i:nth-child(3) {
        color: #fff;
        opacity: 0.6;
      }
      @keyframes show {
        0% {
          transform: translateX(100%);
        }
        40% {
          transform: translateX(-5%);
        }
        80% {
          transform: translateX(0%);
        }
        100% {
          transform: translateX(-10%);
        }
      }
      .toast::before {
        position: absolute;
        bottom: 0;
        left: 0;
        background-color: var(--color);
        width: 100%;
        height: 3px;
        content: "";
        box-shadow: 0 0 10px var(--color);
        animation: timeOut 3s linear 1 forwards;
      }
      @keyframes timeOut {
        to {
          width: 0;
        }
      }
      .toast.error {
        --color: #f24d4c;
        background-image: linear-gradient(to right, #f24d4c55, #22242f 30%);
      }
      .toast.warning {
        --color: #e9bd0c;
        background-image: linear-gradient(to right, #e9bd0c55, #22242f 30%);
      }
      .toast.info {
        --color: #3498db;
        background-image: linear-gradient(to right, #3498db55, #22242f 30%);
      }
    </style>
  </head>
  <body>
    <div class="notifications">
      <div class="toast success">
        <i class="fa-solid fa-circle-check"></i>
        <div class="content">
          <div class="title">Success</div>
          <span>This is a success toast.</span>
        </div>
        <i
          class="fa-solid fa-xmark"
          onclick="(this.parentElement).remove()"
        ></i>
      </div>
    </div>
    <div class="buttons">
      <button id="success">Success</button>
      <button id="error">Error</button>
      <button id="warning">Warning</button>
      <button id="info">Info</button>
    </div>
  </body>
</html>
<script>
  let notifications = document.querySelector(".notifications");
  let success = document.getElementById("success");
  let error = document.getElementById("error");
  let warning = document.getElementById("warning");
  let info = document.getElementById("info");

  function createToast(type, icon, title, text) {
    let newToast = document.createElement("div");
    newToast.innerHTML = `
            <div class="toast ${type}">
                <i class="${icon}"></i>
                <div class="content">
                    <div class="title">${title}</div>
                    <span>${text}</span>
                </div>
                <i class="fa-solid fa-xmark" onclick="(this.parentElement).remove()"></i>
            </div>`;
    notifications.appendChild(newToast);
    newToast.timeOut = setTimeout(() => newToast.remove(), 3000);
  }
  success.onclick = function () {
    let type = "success";
    let icon = "fa-solid fa-circle-check";
    let title = "Success";
    let text = "This is a success toast.";
    createToast(type, icon, title, text);
  };
  error.onclick = function () {
    let type = "error";
    let icon = "fa-solid fa-circle-exclamation";
    let title = "Error";
    let text = "This is a error toast.";
    createToast(type, icon, title, text);
  };
  warning.onclick = function () {
    let type = "warning";
    let icon = "fa-solid fa-triangle-exclamation";
    let title = "Warning";
    let text = "This is a warning toast.";
    createToast(type, icon, title, text);
  };
  info.onclick = function () {
    let type = "info";
    let icon = "fa-solid fa-circle-info";
    let title = "Info";
    let text = "This is a info toast.";
    createToast(type, icon, title, text);
  };
</script>
